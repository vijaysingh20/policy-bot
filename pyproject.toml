[project]
name = "policy-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.30.0",
    "langchain-community==0.4.1",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.12.2",
    "numpy>=2.5.3",
    "openai>=2.54.0",
    "pydantic>=2,<3",
    "pypdf>=6.17.0",
    "python-multipart>=0.0.32",
    "ragas==0.4.3",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: loads real ML models",
    "eval: calls the LLM / RAGAS (costs money)",
]
addopts = "-m 'not slow and not eval'"
